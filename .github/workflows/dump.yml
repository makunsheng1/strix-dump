name: dump-strix-sandbox
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: docker pull ghcr.io/usestrix/strix-sandbox:latest

      - name: Save and compress
        run: |
          docker save ghcr.io/usestrix/strix-sandbox:latest -o sandbox.tar
          gzip -1 sandbox.tar
          ls -lh sandbox.tar.gz
          sha256sum sandbox.tar.gz > sha256.txt
          cat sha256.txt

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "sandbox-${GITHUB_RUN_ID}" sandbox.tar.gz sha256.txt \
            -R "${GITHUB_REPOSITORY}" \
            --title "strix-sandbox" \
            --notes "ghcr.io/usestrix/strix-sandbox:latest"